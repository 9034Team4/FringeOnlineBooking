version: '3'
services:
  gateway:
    image: nginx:alpine
    container_name: gateway
    ports:
      - "90:90"
    volumes:
      - ./docker/nginx/booking.conf:/etc/nginx/conf.d/booking.conf
    networks:
      - mynet
    restart: always

  backend:
    build: ./backend
    container_name: backend
    restart: always
    env_file:
      - /home/ec2-user/envs/backend.env
    depends_on:
      - mysql
      - redis
    networks:
      - mynet
    ports:
      - "3000:3000"

  frontend-admin:
    build: ./frontend-admin
    container_name: admin-ui
    restart: always
    networks:
      - mynet
    ports:
      - "8081:80"

  frontend-public:
    build: ./frontend-public
    container_name: public-ui
    restart: always
    networks:
      - mynet
    ports:
      - "8082:80"

  mysql:
    image: mysql:8
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: fringe2025bookingdb_dev
      MYSQL_USER: root
      MYSQL_PASSWORD: 12345678
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mynet

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - mynet

networks:
  mynet:
    driver: bridge

volumes:
  mysql_data:
