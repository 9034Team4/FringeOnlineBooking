name: CI/CD - Backend

on:
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SSH to EC2 and deploy Backend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user

            # Upload or update backend.env from GitHub secret
            mkdir -p /home/ec2-user/envs
            echo "${{ secrets.BACKEND_ENV }}" > /home/ec2-user/envs/backend.env

            # Clone the repo if it's not already present
            if [ ! -d "fringeonlinebooking/.git" ]; then
              git clone https://github.com/9034Team4/FringeOnlineBooking.git fringeonlinebooking
            fi

            cd fringeonlinebooking

            git fetch origin
            git checkout dev
            git pull origin dev

            docker-compose build backend
            docker-compose up -d backend
