name: CI/CD - Backend

on:
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    if: contains(github.event.head_commit.message, '#test-backend') || contains(github.event.head_commit.message, '#deploy-backend')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd backend
          npm install

      - name: Run tests
        run: |
          cd backend
          npm run test

  deploy:
    needs: test
    if: contains(github.event.head_commit.message, '#deploy-backend')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SSH to EC2 and deploy Backend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user

            # ✅
            mkdir -p envs
            echo "${{ secrets.BACKEND_ENV }}" > envs/backend.env

            # ✅ 
            if [ ! -d "fringeonlinebooking/.git" ]; then
              git clone https://github.com/9034Team4/FringeOnlineBooking.git fringeonlinebooking
            fi

            cd fringeonlinebooking

            # ✅ 
            if [ -d ".git" ]; then
              git fetch origin
              git checkout dev
              git pull origin dev
            else
              echo "❌ Not a Git repository!"
              exit 1
            fi

            # ✅ 
            docker-compose build backend
            docker-compose up -d backend
