name: CI/CD - Admin Frontend

on:
  push:
    branches: [dev]
    paths:
      - 'frontend-admin/**'
      - '.github/workflows/frontend-admin.yml'

jobs:
  test:
    if: contains(github.event.head_commit.message, '#test-admin') || contains(github.event.head_commit.message, '#deploy-admin')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: frontend-admin
        run: npm install --legacy-peer-deps

      - name: Run tests
        working-directory: frontend-admin
        run: npm run test

  deploy:
    needs: test
    if: contains(github.event.head_commit.message, '#deploy-admin')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SSH to EC2 and deploy Admin Frontend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/fringeonlinebooking
            git fetch origin
            git checkout dev
            git pull origin dev

            docker-compose build frontend-admin
            docker-compose up -d frontend-admin
