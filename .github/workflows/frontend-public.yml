name: CI/CD - Public Frontend

on:
  push:
    branches: [dev]
    paths:
      - 'frontend-public/**'
      - '.github/workflows/frontend-public.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SSH to EC2 and deploy Public Frontend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/fringeonlinebooking
            git pull origin main
            docker-compose build frontend-public
            docker-compose up -d frontend-public
