name: CI/CD - Public Frontend

on:
  push:
    branches: [dev]
    paths:
      - 'frontend-public/**'
      - '.github/workflows/frontend-public.yml'

jobs:
  test:
    if: contains(github.event.head_commit.message, '#test-public') || contains(github.event.head_commit.message, '#deploy-public')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd frontend-public
          npm install --legacy-peer-deps

      - name: Run tests
        run: |
          cd frontend-public
          npm run test

  deploy:
    needs: test
    if: contains(github.event.head_commit.message, '#deploy-public')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SSH to EC2 and deploy Public Frontend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/fringeonlinebooking

            git fetch origin
            git checkout dev
            git pull origin dev

            docker-compose build frontend-public
            docker-compose up -d frontend-public
