server {
    listen 90;
    server_name localhost;

    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://admin-ui/;
        try_files $uri $uri/ /index.html;
    }

    location /user/ {
        proxy_pass http://public-ui/;
        try_files $uri $uri/ /index.html;
    }
}
